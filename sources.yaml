    proxy: us
    headers: sec_declared
    note: SEC EDGAR 8-K 滚动窗（声明式 UA，勿改浏览器 UA）
  - id: nyt_business
    adapter: rss
    channel: us_news
    job: news_us
    url: https://rss.nytimes.com/services/xml/rss/nyt/Business.xml
    proxy: us
    headers: browser
    note: 纽约时报商业（摘要丰富）
  - id: nyt_economy
    adapter: rss
    channel: us_news
    job: news_us
    url: https://rss.nytimes.com/services/xml/rss/nyt/Economy.xml
    proxy: us
    headers: browser
    note: 纽约时报经济
  - id: wsj_markets
    adapter: rss
    channel: us_news
    job: news_us
    url: https://feeds.a.dj.com/rss/RSSMarketsMain.xml
    proxy: us
    headers: browser
    note: 华尔街日报市场（付费墙只给标题）
  - id: wsj_business
    adapter: rss
    channel: us_news
    job: news_us
    url: https://feeds.a.dj.com/rss/WSJcomUSBusiness.xml
    proxy: us
    headers: browser
    note: 华尔街日报商业
  - id: wsj_world
    adapter: rss
    channel: us_news
