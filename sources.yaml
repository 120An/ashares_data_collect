# 数据源注册表：采集型源的单一事实来源（spec docs/superpowers/specs/2026-07-08-source-registry-design.md）
# - id 即归档目录名，不可变（改名=换存档，视为新源）
# - 改动流程：编辑 → python manage_sources.py validate → git 提交 → 目标机 pull
#   → 下一轮调度自动生效（子进程每轮重读，无需重启）
# - 新源上线：先 python manage_sources.py test <id> 冒烟，再置 enabled: true
version: 1

defaults:
  enabled: true

sources:
  # ================= news_policy（每小时 news_hourly）=================
  - id: govcn_policy
    adapter: rss
    channel: policy
    job: news_policy
    url: https://www.gov.cn/pushinfo/v150203/rss.xml
    headers: browser
    note: 中国政府网-最新政策
  - id: govcn_gwy
    adapter: api
    channel: policy
    job: news_policy
    url: https://sousuo.www.gov.cn/search-gov/data
    headers: browser
    note: 中国政府网-国务院政策文件库
  - id: stats
    adapter: rss
    channel: policy
    job: news_policy
    url: https://www.stats.gov.cn/sj/zxfb/rss.xml
    headers: browser
    enabled: false   # 2026-07-16 起源头挂死（60s 超时，每小时告警刷屏）；恢复后
                     # `manage_sources.py test stats` 冒烟通过再打开（2026-07-23 停）
    note: 国家统计局-最新发布

  # ================= news_us（每日 05:30，全部经 us 代理）=================
  - id: fed
    adapter: rss
    channel: us_policy
    job: news_us
    url: https://www.federalreserve.gov/feeds/press_all.xml
