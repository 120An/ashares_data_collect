# News Source governance master data (V1.1 / Phase 1).
# Acquisition facts such as adapter, endpoint, channel and enabled state remain
# sourced from sources.yaml or explicit production-code facts in source_catalog.py.
# Authority has not yet been formally assessed, so every source is explicitly
# unrated and carries no numeric score.
# directness describes whether the configured channel is the identified
# publisher/origin channel; it does not assert that every individual article
# is original. is_official is reserved for government/regulator/exchange or
# formal disclosure channels, not merely a publisher-owned transport endpoint.
# For overseas RSS, the repository has no explicit publisher-local timezone;
# UTC is a provisional interpretation basis matching feedparser's parsed UTC
# values, not a claim about publisher locale, and remains governance-revisable.
version: 1

defaults:
  source_revision: 1
  authority_status: unrated
  source_authority: null
  authority_version: source_authority_v1
  authority_effective_from: "2026-08-16T00:00:00+08:00"
  content_license: unknown
  paywall_type: unknown
  created_at: "2026-08-16T00:00:00+08:00"
  updated_at: "2026-08-16T00:00:00+08:00"

